<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <div class="container">
        <header>
            <div class="logo-search-wrapper">
                <div class="logo">
                    <a href="index.html">
                    <img src="assets/images/icons/Logo.svg" alt="morent logo">
                    </a>
                </div>
                <div class="search">
                    <img src="assets/images/icons/search.svg" alt="search icon">
                    <input type="text" placeholder="Search something here">
                    <a href="filter.html">
                        <img src="assets/images/icons/filter.svg" alt="filter icon">
                    </a>
                </div>
    
            </div>
    
            <div class="cta-wrapper">
                <div class="cta">
                    <img src="assets/images/icons/heart.svg" alt="heart icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/notification.svg" alt="notification icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/setting2.svg" alt="settings icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/user.png" alt="user icon">
                </div>
    
            </div>
        </header>


    </div>

    <main>
        <aside>
            <form>
                <div class="filters type">
                    <h3>type</h3>
                    <div class="wrapper">
                        <div>
                            <input type="checkbox" id="sport" checked>
                            <label for="sport">Sport </label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="suv" checked>
                            <label for="suv">SUV</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="mvp">
                            <label for="mvp">MVP</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="sedan">
                            <label for="sedan">Sedan</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="coupe">
                            <label for="coupe">Coupe</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="hatchback">
                            <label for="hatchback">Hatchback</label>
                            <span>(10)</span>
                        </div>

                    </div>
                </div>

                <div class="filters capacity">
                    <h3>capacity</h3>
                    <div class="wrapper">
                        <div>
                            <input type="checkbox" id="2person" checked>
                            <label for="2person">Sport </label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="4person" >
                            <label for="4person">SUV</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="6person">
                            <label for="6person">MVP</label>
                            <span>(10)</span>
                        </div>
                        <div>
                            <input type="checkbox" id="8person" checked>
                            <label for="8person">Sedan</label>
                            <span>(10)</span>
                        </div>
                       

                    </div>



                </div>

                <div class="filters price">
                    <h3>price</h3>
                    <input type="range" name="" id="" value="80">
                    <span>Max.100.</span>

                </div>


            </form>

        </aside>
    </main>


</body>
</html>
