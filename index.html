<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    
    <header>
        <div class="logo-search-wrapper">
            <div class="ligo">
                <img src="assets/images/icons/Logo.svg" alt="morent logo">
            </div>
            <div class="search">
                search
            </div>

        </div>

        <div class="cta-wrapper">
            <div class="cta">
                <img src="assets/images/icons/heart.svg" alt="heart icon">
            </div>
            <div class="cta">
                <img src="assets/images/icons/notification.svg" alt="notification icon">
            </div>
            <div class="cta">
                <img src="assets/images/icons/setting2.svg" alt="settings icon">
            </div>
            <div class="cta">
                <img src="assets/images/icons/user.png" alt="user icon">
            </div>

        </div>
    </header>

    <section class="cover">
        <div class="wrapper flex align-center justify-center">
            <article class="car-card-light-blue">
                <div class="details-wrapper">
                    <h2>The Best Platform for Car Rental</h2>
                    <p>Ease of doing a car rental safely and reliably. Of course at a low price.</p>
                    <button class="btn">Rental Car</button>
                </div>
                <div class="image-wrapper">
                    <img src="assets/images/cars/car1.png" alt="car 1">
                </div>
            </article>
            <article class="car-card-dark-blue">
                <div class="details-wrapper">
                    <h2>Easy way to rent a car at a low price</h2>
                    <p>Providing cheap car rental services and safe and comfortable facilities.</p>
                    <button class="btn">Rental Car</button>
                </div>
                <div class="image-wrapper">
                    <img src="assets/images/cars/car2.png" alt="car 2">
                </div>
            </article>

        </div>

    </section>



</body>
</html>
